<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vote pour ton favori</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .vote-form {
        margin-bottom: 20px;
    }

    .results {
        margin-top: 20px;
        padding: 10px;
        background: #f0f0f0;
    }
</style>
</head>

<body>

<h1>Vote pour ton favori</h1>

<form class="vote-form" id="voteForm">

    <p>Coche la personne pour laquelle tu veux voter :</p>

    <input type="checkbox" id="person1" name="vote" value="Alice">
    <label for="person1">Alice</label><br>

    <input type="checkbox" id="person2" name="vote" value="Bob">
    <label for="person2">Bob</label><br>

    <input type="checkbox" id="person3" name="vote" value="Charlie">
    <label for="person3">Charlie</label><br><br>

    <button type="submit">Voter</button>

</form>

<div class="results">

    <h2>Résultats</h2>

    <input type="password" id="accessCode" placeholder="Entrez le code">
    <button onclick="showResults()">Voir les résultats</button>

    <div id="resultsContent"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

    // CONFIG FIREBASE
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        authDomain: "TON_PROJET.firebaseapp.com",
        databaseURL: "https://TON_PROJET.firebaseio.com",
        projectId: "TON_PROJET",
        storageBucket: "TON_PROJET.appspot.com",
        messagingSenderId: "XXXX",
        appId: "XXXX"
    };

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();

    // Objet des votes
    let votes = {
        Alice: 0,
        Bob: 0,
        Charlie: 0
    };

    // Synchronisation en temps réel
    database.ref("votes").on("value", (snapshot) => {

        const data = snapshot.val();

        if (data) {
            votes = data;
        }

        console.log("Votes synchronisés :", votes);

    });

    // Envoi du vote
    document.getElementById("voteForm").addEventListener("submit", function(e) {

        e.preventDefault();

        const selected = Array.from(
            document.querySelectorAll('input[name="vote"]:checked')
        ).map(el => el.value);

        if (selected.length === 0) {
            alert("Choisis au moins une personne");
            return;
        }

        selected.forEach(person => {

            const currentVotes = votes[person] || 0;

            database.ref("votes/" + person).set(currentVotes + 1);

        });

        // Décocher après vote
        document.querySelectorAll('input[name="vote"]').forEach(el => {
            el.checked = false;
        });

        alert("Merci pour ton vote !");

    });

    // Afficher résultats
    function showResults() {

        const code = document.getElementById("accessCode").value;

        if (code === "SuperVote123") {

            document.getElementById("resultsContent").innerHTML = `
                <p>Alice : ${votes.Alice || 0} votes</p>
                <p>Bob : ${votes.Bob || 0} votes</p>
                <p>Charlie : ${votes.Charlie || 0} votes</p>
            `;

        } else {

            alert("Code incorrect !");

        }
    }

</script>

</body>
</html>
