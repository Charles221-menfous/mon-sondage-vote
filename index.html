<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote en ligne</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        cursor: pointer;
    }

    .results {
        margin-top: 20px;
        padding: 15px;
        background: #eee;
        border-radius: 10px;
    }

    label {
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="container">

    <h1>Vote pour ton favori</h1>

    <form id="voteForm">

        <input type="radio" name="vote" value="Alice" required>
        <label>Alice</label><br><br>

        <input type="radio" name="vote" value="Bob">
        <label>Bob</label><br><br>

        <input type="radio" name="vote" value="Charlie">
        <label>Charlie</label><br><br>

        <button type="submit">Voter</button>

    </form>

    <div class="results">

        <h2>Résultats</h2>

        <input type="password" id="code" placeholder="Code d'accès">

        <button onclick="showResults()">Voir les résultats</button>

        <div id="resultsContent"></div>

    </div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// CONFIG FIREBASE
const firebaseConfig = {
    apiKey: "TON_API_KEY",
    authDomain: "TON_PROJET.firebaseapp.com",
    databaseURL: "https://TON_PROJET-default-rtdb.firebaseio.com",
    projectId: "TON_PROJET",
    storageBucket: "TON_PROJET.appspot.com",
    messagingSenderId: "XXXXXXXX",
    appId: "XXXXXXXX"
};

// Initialisation
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Création des votes si inexistants
const votesRef = ref(db, "votes");

async function initVotes() {

    const snapshot = await get(votesRef);

    if (!snapshot.exists()) {

        await set(votesRef, {
            Alice: 0,
            Bob: 0,
            Charlie: 0
        });

    }
}

initVotes();


// Vote
document.getElementById("voteForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const selected = document.querySelector('input[name="vote"]:checked').value;

    const snapshot = await get(votesRef);

    const votes = snapshot.val();

    votes[selected]++;

    await update(votesRef, votes);

    alert("Merci pour ton vote !");

    this.reset();

});


// Voir résultats
window.showResults = async function() {

    const code = document.getElementById("code").value;

    if (code !== "SuperVote123") {
        alert("Code incorrect !");
        return;
    }

    const snapshot = await get(votesRef);

    const votes = snapshot.val();

    document.getElementById("resultsContent").innerHTML = `
        <p><strong>Alice :</strong> ${votes.Alice} votes</p>
        <p><strong>Bob :</strong> ${votes.Bob} votes</p>
        <p><strong>Charlie :</strong> ${votes.Charlie} votes</p>
    `;
};

</script>

</body>
</html>
