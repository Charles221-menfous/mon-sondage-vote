<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vote pour le Roi et la Reine du Bal</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        max-width: 600px;
        margin: 0 auto;
        background-color: violet;
    }
    .vote-section {
        margin-bottom: 30px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    .results {
        margin-top: 20px;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 5px;
    }
    button {
        padding: 8px 15px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover {
        background: #45a049;
    }
    input[type="radio"] {
        margin-right: 10px;
    }
    #resultsContent p {
        margin: 5px 0;
    }
</style>
</head>
<body>

<h1>Vote pour le Roi et la Reine du Bal</h1>

<!-- Section Vote Roi -->
<div class="vote-section">
    <h2>Vote pour le Roi</h2>
    <form id="voteRoiForm">
        <p>Choisis ton candidat :</p>
        <input type="radio" id="roiARFAOUI Sacha" name="roi" value="ARFAOUI Sacha">
        <label for="roiARFAOUI Sacha">ARFAOUI Sacha</label><br>
        <input type="radio" id="roiBob" name="roi" value="Bob">
        <label for="roiBob">Bob</label><br>
        <input type="radio" id="roiCharlie" name="roi" value="Charlie">
        <label for="roiCharlie">Charlie</label><br><br>
        <button type="submit">Voter pour le Roi</button>
    </form>
</div>

<!-- Section Vote Reine -->
<div class="vote-section">
    <h2>Vote pour la Reine</h2>
    <form id="voteReineForm">
        <p>Choisis ta candidate :</p>
        <input type="radio" id="reineAlice" name="reine" value="Alice">
        <label for="reineAlice">Alice</label><br>
        <input type="radio" id="reineBob" name="reine" value="Bob">
        <label for="reineBob">Bob</label><br>
        <input type="radio" id="reineCharlie" name="reine" value="Charlie">
        <label for="reineCharlie">Charlie</label><br><br>
        <button type="submit">Voter pour la Reine</button>
    </form>
</div>

<!-- Section Résultats -->
<div class="results">
    <h2>Résultats</h2>
    <input type="password" id="accessCode" placeholder="Entrez le code">
    <button onclick="showResults()">Voir les résultats</button>
    <div id="resultsContent"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // 🔥 CONFIG FIREBASE (remplace par TES valeurs)
const firebaseConfig = {
  apiKey: "AIzaSyA_rzMF1mKk8J6FETOa5rjrxm8uHcAeJRo",
  authDomain: "bal-2k26.firebaseapp.com",
  databaseURL: "https://bal-2k26-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bal-2k26",
  storageBucket: "bal-2k26.firebasestorage.app",
  messagingSenderId: "817684504280",
  appId: "1:817684504280:web:0eb1f7930b1eab6e1541ad"
};

  // Initialise Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // 🔐 Mot de passe pour les résultats
  const RESULT_PASSWORD = "SuperBal2026";

  // 📦 Références Firebase
  const roiRef = database.ref("votes/roi");
  const reineRef = database.ref("votes/reine");

  // 🔄 Synchronisation des votes en temps réel
  let roiVotes = {};
  let reineVotes = {};

  roiRef.on("value", (snapshot) => {
      roiVotes = snapshot.val() || {};
      console.log("Votes Roi:", roiVotes);
  });

  reineRef.on("value", (snapshot) => {
      reineVotes = snapshot.val() || {};
      console.log("Votes Reine:", reineVotes);
  });



// Dans la gestion du vote pour le Roi
document.getElementById("voteRoiForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const selected = document.querySelector('input[name="roi"]:checked');
    if (!selected) {
        alert("Choisis un candidat pour le Roi !");
        return;
    }
    const candidate = selected.value;
    console.log("Envoi du vote pour le Roi :", candidate); // <-- Ajoute ça
    if (localStorage.getItem("votedRoi")) {
        alert("Tu as déjà voté pour le Roi !");
        return;
    }
    roiRef.child(candidate).transaction((current) => {
        console.log("Transaction pour", candidate, ":", current, "->", (current || 0) + 1); // <-- Ajoute ça
        return (current || 0) + 1;
    });
    localStorage.setItem("votedRoi", "true");
    alert("Merci pour ton vote pour le Roi !");
    selected.checked = false;
});


    

  // Dans la gestion du vote pour le Roi
document.getElementById("voteReineForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const selected = document.querySelector('input[name="reine"]:checked');
    if (!selected) {
        alert("Choisis un candidat pour le Reine !");
        return;
    }
    const candidate = selected.value;
    console.log("Envoi du vote pour le Reine :", candidate); // <-- Ajoute ça
    if (localStorage.getItem("votedReine")) {
        alert("Tu as déjà voté pour le Reine !");
        return;
    }
    roiRef.child(candidate).transaction((current) => {
        console.log("Transaction pour", candidate, ":", current, "->", (current || 0) + 1); // <-- Ajoute ça
        return (current || 0) + 1;
    });
    localStorage.setItem("votedReine", "true");
    alert("Merci pour ton vote pour le Reine !");
    selected.checked = false;
});

    
  // 📊 Affichage des résultats
  function showResults() {
      const code = document.getElementById("accessCode").value;
      if (code !== RESULT_PASSWORD) {
          alert("Code incorrect !");
          return;
      }
      let html = "<h3>Roi</h3>";
      for (const [candidate, votes] of Object.entries(roiVotes)) {
          html += `<p>${candidate} : <strong>${votes}</strong> votes</p>`;
      }
      html += "<h3>Reine</h3>";
      for (const [candidate, votes] of Object.entries(reineVotes)) {
          html += `<p>${candidate} : <strong>${votes}</strong> votes</p>`;
      }
      document.getElementById("resultsContent").innerHTML = html;
  }
</script>

</body>
</html>
